<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E07A3A">
  <meta name="description" content="ヨーロッパで活躍する日本人博士によるキャリアトーク。渡邉 洸（DFKI）。筑波大学主催、2026年11月26日。">
  <title>キャリアトーク · 渡邉 洸 · 筑波大学</title>
  <link rel="icon" href="/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="deck.css">
  <script type="module" src="deck.js"></script>
</head>

<body>
  <a class="skip-link" href="#slide-content">スライドへスキップ</a>
  <main id="viewport" aria-label="筑波大学キャリアトーク">
    <div id="stage" role="region" aria-label="スライド発表"></div>
  </main>
  <nav class="controls" aria-label="発表コントロール">
    <a class="back-link" href="/slides/" aria-label="スライド一覧へ">↖ <span>Slides</span></a>
    <div class="slide-position"><span id="page-number">01 / 18</span><span class="control-divider"></span><span
        id="section-name">はじめに</span></div>
    <div class="tools">
      <button id="outline-button" title="目次 (O)">目次</button>
      <button id="notes-button" title="スピーカーノート (N)">ノート</button>
      <button id="fullscreen-button" title="全画面 (F)">全画面</button>
      <button id="previous-button" class="arrow" aria-label="前のスライド" title="前のスライド (←)">←</button>
      <button id="next-button" class="arrow next" aria-label="次のスライド" title="次のスライド (→ または Space)">→</button>
    </div>
    <div class="progress-track">
      <div id="progress"></div>
    </div>
  </nav>
  <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
  <p id="notice" class="notice" role="status" hidden></p>
  <dialog id="outline-dialog" aria-labelledby="outline-title">
    <div class="dialog-top">
      <div>
        <p class="eyebrow">筑波大学</p>
        <h2 id="outline-title">本日の構成</h2>
      </div><button class="close-dialog" aria-label="目次を閉じる">✕</button>
    </div>
    <div id="outline-list"></div>
    <p class="dialog-hint">← / → 移動 &nbsp; F 全画面 &nbsp; N ノート &nbsp; R アニメ再生 &nbsp; P 印刷 / PDF &nbsp; Esc 閉じる</p>
  </dialog>
  <dialog id="notes-dialog" aria-labelledby="notes-title">
    <div class="dialog-top">
      <div>
        <p class="eyebrow" id="notes-timing"></p>
        <h2 id="notes-title">スピーカーノート</h2>
      </div><button class="close-dialog" aria-label="ノートを閉じる">✕</button>
    </div>
    <div class="notes-toolbar"><span id="talk-clock">00:00 / 30:00</span><button
        id="timer-button">タイマー開始</button><button id="reset-timer">リセット</button><button id="print-button">印刷 /
        PDF保存</button></div>
    <div id="notes-content"></div>
    <h3>参考リンク</h3>
    <ul id="notes-sources"></ul>
    <p class="dialog-hint">発表者用のメモです。N または Esc で閉じます。</p>
  </dialog>
  <noscript>
    <p class="no-script">このインタラクティブなスライドを表示するには JavaScript を有効にしてください。</p>
  </noscript>
</body>

</html>
